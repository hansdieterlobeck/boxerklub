services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-boxerklub}
      MYSQL_USER: ${DB_USER:-boxerklub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-boxerklub}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-boxerklub}
      WORDPRESS_DB_USER: ${DB_USER:-boxerklub}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-boxerklub}
    volumes:
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-boxerklub}
      WORDPRESS_DB_USER: ${DB_USER:-boxerklub}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-boxerklub}
    volumes:
      - ./wp-content:/var/www/html/wp-content
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
